repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        exclude: |
          (?x)^(
            trait-visualization/trait-profile-investigation/six-shared-traits/.*heatmap.*\.png
            |data/derived/study_trait_profiles_wide\.tsv\.gz
          )$
      - id: check-added-large-files
        name: check six-trait heatmap sizes (2 MiB)
        # Full-resolution scientific figures retain a bounded size check (#508).
        files: '^trait-visualization/trait-profile-investigation/six-shared-traits/.*heatmap.*\.png$'
        args: [--maxkb=2048, --enforce-all]
      - id: check-added-large-files
        name: check published profile bundle size (5 MiB)
        # Preserve the committed input bundle while checking future growth (#508).
        files: '^data/derived/study_trait_profiles_wide\.tsv\.gz$'
        args: [--maxkb=5120, --enforce-all]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # Trailing TSV fields and generated vector output must remain intact.
        exclude: '\.(tsv|csv|svg)$'
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        # Preserve source labels and opaque IDs in generated scientific artifacts.
        exclude: '^(trait-visualization|trait-profile-investigation)/.*\.(tsv|csv|svg|json|html)$'
        additional_dependencies:
          - tomli
  - repo: https://github.com/crate-ci/typos
    rev: v1.31.1
    hooks:
      - id: typos
        exclude: '^(trait-visualization|trait-profile-investigation)/.*\.(tsv|csv|svg|json|html)$'
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # Generated public checksums/commit IDs, not credential-bearing inputs (#259).
        exclude: |
          (?x)^(
            data/.*provenance\.json
            |trait-visualization/trait-profile-investigation/
            six-shared-traits/oral/oral_six_trait_provenance\.json
          )$
        # Only reviewed public checksum values are baselined; new values still fail.
        args: [--baseline, .secrets.baseline]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.22
    hooks:
      - id: uv-lock
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
  - repo: local
    hooks:
      - id: deptry
        name: deptry
        entry: uv run deptry src
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        always_run: true
      - id: check-generated-artifacts
        name: check-generated-artifacts
        entry: just check-generated
        language: system
        pass_filenames: false
        always_run: true
      - id: pip-audit
        name: pip-audit
        entry: uv run pip-audit
        language: system
        pass_filenames: false
        always_run: true
      - id: linkml-lint
        name: linkml-lint
        entry: uv run linkml lint --config schema/.linkmllint.yaml --validate --ignore-warnings schema/bsdbng.yaml
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: uv run pytest --cov=src --cov-report=term-missing -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
