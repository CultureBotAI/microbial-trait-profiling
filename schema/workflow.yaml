id: https://w3id.org/mtp/workflow
name: mtp_workflow
title: Execution-checked microbial trait workflow
description: Versioned product and workflow contracts, execution attempts, and verified artifact instances.
  Structural validation is supplemented by graph, filesystem, checksum, and scientific product checks.
license: MIT
version: 1.0.0
default_prefix: mtpw
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  mtpw: https://w3id.org/mtp/workflow/
  prov: http://www.w3.org/ns/prov#
imports:
  - linkml:types
enums:
  ContrastPopulation:
    title: Contrast Population
    description: Executed experiment selection policy, separate from downstream trait eligibility.
    permissible_values:
      all_paired:
        description: Preserve the unfiltered core; downstream analyses retain their human pairing rules.
      disease_vs_healthy_tier1_2_subject_controls:
        description: Paired human disease contrasts with Tier 1 or Tier 2 subject controls.
      case_vs_control_subject:
        description: Paired human disease contrasts with subject controls, including Tier 3.
      disease_vs_healthy_oriented:
        description: All paired human contrasts classified as disease versus healthy, including non-subject comparisons.
  DirectionBasis:
    title: Direction Basis
    description: Meaning of increased and decreased in the consumed core products.
    permissible_values:
      group_1_vs_group_0:
        description: Original BugSigDB Group 1 relative to Group 0.
      disease_vs_comparison:
        description: Disease group relative to the selected comparison, after explicit reversal where required.
  StorageKind:
    permissible_values:
      file: null
      collection: null
    title: Storage Kind
    description: Permitted storage kind values.
  ExecutionStatus:
    permissible_values:
      running: null
      completed: null
      failed: null
      imported_unverified: null
    title: Execution Status
    description: Permitted execution status values.
  ValidationStatus:
    permissible_values:
      passed: null
      failed: null
    title: Validation Status
    description: Permitted validation status values.
  CalibrationOutcome:
    title: Calibration Outcome
    description: Standardized empirical calibration classification across analytical arms.
    permissible_values:
      calibrated:
        description: Null type-I error and FDR meet declared tolerances and power meets minimum on the exact production AnalysisSpec.
      partially_calibrated:
        description: Some calibration criteria pass while others fail or remain unassessed on the evaluated AnalysisSpec.
      anti_conservative:
        description: Empirical type-I error or null FDR exceeds the declared tolerance upper bound.
      null_controlled_low_power:
        description: Empirical null control passes, but power under the declared injected effect falls below minimum.
      insufficient_budget:
        description: Replicate budget is below the protocol minimum required to certify calibration.
      different_estimator_uncalibrated:
        description: Calibration harness evaluated a different AnalysisSpec than the production estimator.
classes:
  ProductDefinition:
    description: A stable scientific product contract, independent of its location.
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^[A-Za-z][A-Za-z0-9_.-]*$
        title: Id
        description: Identifier unique within its containing document.
      description:
        description: Human-readable product meaning.
        title: Description
      kind:
        required: true
        description: Scientific validator contract name.
        title: Kind
      storage_kind:
        range: StorageKind
        required: true
        title: Storage kind
        description: Whether the artifact is a regular file or an inventoried directory.
      format:
        required: true
        description: Serialization format.
        title: Format
      filename:
        required: true
        description: Relative path inside a producer bundle.
        title: Filename
      external:
        range: boolean
        ifabsent: 'false'
        title: External
        description: Whether this product is supplied explicitly rather than produced by a step.
      schema_ref:
        description: Versioned scientific schema reference.
        title: Schema ref
      unit:
        description: Meaning of one row or observation.
        title: Unit
      cohort:
        description: Expected population selection policy.
        title: Cohort
      cohort_parameter:
        range: ParameterDefinition
        description: Parameter determining effective cohort.
        title: Cohort parameter
      feature_policy:
        description: Feature inclusion and identity policy.
        title: Feature policy
      coverage_policy:
        description: Required coverage and exclusion accounting.
        title: Coverage policy
    title: Product Definition
  ParameterDefinition:
    description: An explicitly resolved string parameter; undeclared overrides are rejected.
    attributes:
      name:
        identifier: true
        required: true
        pattern: ^[A-Za-z][A-Za-z0-9_]*$
        title: Name
        description: Declared parameter identifier.
      default:
        description: Default value before explicit environment and API overrides.
        title: Default
      environment:
        description: Optional explicitly permitted environment variable.
        title: Environment
      required:
        range: boolean
        ifabsent: 'false'
        title: Required
        description: Whether execution requires an effective parameter value.
    title: Parameter Definition
  ParameterValue:
    description: The effective value and source of one declared parameter.
    attributes:
      name:
        required: true
        title: Name
        description: Declared parameter identifier.
      value:
        required: true
        title: Value
        description: Effective resolved parameter value passed to the operation.
      source:
        required: true
        title: Source
        description: 'Origin of the effective value: default, declared environment variable, or override.'
    title: Parameter Value
  StepDefinition:
    description: An operation registry key and its typed input and output products.
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^[A-Za-z][A-Za-z0-9_.-]*$
        title: Id
        description: Identifier unique within its containing document.
      operation:
        required: true
        title: Operation
        description: Key resolving to an explicitly registered Python callable.
      description:
        description: Purpose of this step.
        title: Description
      inputs:
        range: ProductDefinition
        multivalued: true
        required: true
        title: Inputs
        description: Product references whose verified artifact paths are passed to the operation.
      outputs:
        range: ProductDefinition
        multivalued: true
        required: true
        title: Outputs
        description: Declared outputs; references are resolved and checked against their producers.
      depends_on:
        range: StepDefinition
        multivalued: true
        title: Depends on
        description: Additional prerequisite step references beyond input-producing dependencies.
      parameters:
        range: ParameterDefinition
        multivalued: true
        title: Parameters
        description: Declared or effective parameters scoped to this definition or execution.
    title: Step Definition
  WorkflowDefinition:
    tree_root: true
    description: Versioned graph of typed products and registered Python operations.
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^[A-Za-z][A-Za-z0-9_.-]*$
        title: Id
        description: Identifier unique within its containing document.
      version:
        required: true
        title: Version
        description: Version of the declared workflow contract.
      description:
        description: Workflow purpose and scope.
        title: Description
      products:
        range: ProductDefinition
        multivalued: true
        inlined_as_list: true
        required: true
        title: Products
        description: Scientific product contracts available to this workflow.
      steps:
        range: StepDefinition
        multivalued: true
        inlined_as_list: true
        required: true
        title: Steps
        description: Ordered or dependency-resolved workflow stages or their attempted executions.
      parameters:
        range: ParameterDefinition
        multivalued: true
        inlined_as_list: true
        title: Parameters
        description: Declared or effective parameters scoped to this definition or execution.
    title: Workflow Definition
  FileInventoryEntry:
    description: One regular file in an artifact; symlinks and special files are rejected.
    attributes:
      path:
        required: true
        description: Relative member path, or the file basename.
        title: Path
      sha256:
        required: true
        pattern: ^[0-9a-f]{64}$
        title: Sha256
        description: Lowercase SHA-256 of file bytes or the canonical collection inventory.
      size_bytes:
        range: integer
        minimum_value: 0
        required: true
        title: Size bytes
        description: Total number of regular-file bytes represented by this record.
    title: File Inventory Entry
  ValidationResult:
    description: A recorded structural, semantic, or scientific validation outcome.
    attributes:
      validator:
        required: true
        title: Validator
        description: Versioned validation procedure identifier.
      status:
        range: ValidationStatus
        required: true
        title: Status
        description: Explicit lifecycle or validation outcome; only completed verified runs are consumable.
      message:
        required: true
        title: Message
        description: Human-readable validation result.
      details_json:
        description: Validator-specific facts encoded as canonical JSON.
        title: Details json
    title: Validation Result
  ArtifactInstance:
    class_uri: prov:Entity
    description: Immutable product content bound to a particular execution attempt.
    attributes:
      id:
        identifier: true
        required: true
        title: Id
        description: Identifier unique within its containing document.
      product_id:
        range: ProductDefinition
        required: true
        title: Product id
        description: Reference to the embedded product contract.
      run_id:
        range: WorkflowRun
        required: true
        title: Run id
        description: Unique execution-attempt identifier, distinct from the deterministic fingerprint.
      producer_step:
        range: StepExecution
        slot_uri: prov:wasGeneratedBy
        title: Producer step
        description: Reference to the execution that produced this artifact; absent for inputs.
      path:
        required: true
        description: Absolute external path or run-relative output path.
        title: Path
      requested_path:
        description: Original external binding before symlink resolution.
        title: Requested path
      sha256:
        required: true
        pattern: ^[0-9a-f]{64}$
        title: Sha256
        description: Lowercase SHA-256 of file bytes or the canonical collection inventory.
      size_bytes:
        range: integer
        minimum_value: 0
        required: true
        title: Size bytes
        description: Total number of regular-file bytes represented by this record.
      inventory:
        range: FileInventoryEntry
        multivalued: true
        inlined_as_list: true
        required: true
        title: Inventory
        description: Complete sorted list of regular-file members and their byte hashes.
      validations:
        range: ValidationResult
        multivalued: true
        inlined_as_list: true
        required: true
        title: Validations
        description: Recorded inventory and scientific product validation outcomes.
      unit:
        description: Effective observational unit.
        title: Unit
      cohort:
        description: Effective population selection policy or parameter value.
        title: Cohort
      feature_policy:
        description: Effective feature inclusion policy.
        title: Feature policy
      coverage_policy:
        description: Effective exclusion accounting policy.
        title: Coverage policy
    title: Artifact Instance
  StepExecution:
    class_uri: prov:Activity
    description: One attempted operation with concrete inputs and staged outputs.
    attributes:
      id:
        identifier: true
        required: true
        title: Id
        description: Identifier unique within its containing document.
      step_id:
        range: StepDefinition
        required: true
        title: Step id
        description: Reference to the declared step contract.
      status:
        range: ExecutionStatus
        required: true
        title: Status
        description: Explicit lifecycle or validation outcome; only completed verified runs are consumable.
      started_at:
        range: datetime
        required: true
        title: Started at
        description: UTC timestamp when this execution attempt began.
      finished_at:
        range: datetime
        title: Finished at
        description: UTC timestamp when this execution attempt finished or failed.
      input_artifacts:
        range: ArtifactInstance
        slot_uri: prov:used
        multivalued: true
        title: Input artifacts
        description: Concrete artifact references actually bound as operation inputs.
      output_artifacts:
        range: ArtifactInstance
        slot_uri: prov:generated
        multivalued: true
        title: Output artifacts
        description: Concrete artifact references published by this completed operation.
      parameters:
        range: ParameterValue
        multivalued: true
        inlined_as_list: true
        title: Parameters
        description: Declared or effective parameters scoped to this definition or execution.
      error:
        description: Failure diagnostic; failed artifacts are never published.
        title: Error
    title: Step Execution
  WorkflowRun:
    class_uri: prov:Activity
    description: Unique execution attempt with an embedded contract and content fingerprint.
    attributes:
      run_id:
        identifier: true
        required: true
        title: Run id
        description: Unique execution-attempt identifier, distinct from the deterministic fingerprint.
      contrast_population:
        range: ContrastPopulation
        ifabsent: string(all_paired)
        title: Contrast population
        description: Executed selection policy; historical records without this field retain the unfiltered policy.
      direction_basis:
        range: DirectionBasis
        ifabsent: string(group_1_vs_group_0)
        title: Direction basis
        description: Direction semantics of selected Study signatures and all products derived from them.
      definition:
        range: WorkflowDefinition
        inlined: true
        required: true
        title: Definition
        description: Embedded validated workflow definition used by this attempt.
      status:
        range: ExecutionStatus
        required: true
        title: Status
        description: Explicit lifecycle or validation outcome; only completed verified runs are consumable.
      started_at:
        range: datetime
        required: true
        title: Started at
        description: UTC timestamp when this execution attempt began.
      finished_at:
        range: datetime
        title: Finished at
        description: UTC timestamp when this execution attempt finished or failed.
      manifest_path:
        required: true
        title: Manifest path
        description: Location of this run manifest; relocation does not change execution identity.
      spec_path:
        required: true
        title: Spec path
        description: Source location of the workflow specification at execution time.
      spec_sha256:
        required: true
        pattern: ^[0-9a-f]{64}$
        title: Spec sha256
        description: SHA-256 of the exact source specification bytes.
      definition_sha256:
        required: true
        pattern: ^[0-9a-f]{64}$
        title: Definition sha256
        description: SHA-256 of the canonical embedded validated workflow definition.
      execution_fingerprint:
        required: true
        pattern: ^[0-9a-f]{64}$
        title: Execution fingerprint
        description: Deterministic hash of contracts, inputs, code, environment, and resolved values.
      code_sha256:
        required: true
        pattern: ^[0-9a-f]{64}$
        title: Code sha256
        description: SHA-256 of the complete recorded code inventory.
      code_inventory:
        range: FileInventoryEntry
        multivalued: true
        inlined_as_list: true
        required: true
        title: Code inventory
        description: Source and schema files, including untracked code, used to identify implementation.
      lock_sha256:
        required: true
        pattern: ^[0-9a-f]{64}$
        title: Lock sha256
        description: SHA-256 of the dependency lockfile used for this attempt.
      git_commit:
        required: true
        title: Git commit
        description: Repository commit at execution start; code hashes also capture local changes.
      git_dirty:
        range: boolean
        required: true
        title: Git dirty
        description: Whether tracked or untracked repository changes existed at execution start.
      runtime_json:
        required: true
        title: Runtime json
        description: Canonical JSON describing Python, installed package versions, platform, and operations.
      parameters:
        range: ParameterValue
        multivalued: true
        inlined_as_list: true
        title: Parameters
        description: Declared or effective parameters scoped to this definition or execution.
      steps:
        range: StepExecution
        multivalued: true
        inlined_as_list: true
        title: Steps
        description: Ordered or dependency-resolved workflow stages or their attempted executions.
      artifacts:
        range: ArtifactInstance
        multivalued: true
        inlined_as_list: true
        title: Artifacts
        description: Concrete external input and published output artifact instances.
      outputs:
        range: ArtifactInstance
        multivalued: true
        title: Outputs
        description: Declared outputs; references are resolved and checked against their producers.
      error:
        description: Failure diagnostic for the attempt.
        title: Error
    title: Workflow Run
  ConsumerRecord:
    description: Verified binding of downstream analysis products to a completed workflow run.
    attributes:
      id:
        identifier: true
        required: true
        title: Id
        description: Identifier unique within its containing document.
      run_id:
        range: WorkflowRun
        required: true
        title: Run id
        description: Unique execution-attempt identifier, distinct from the deterministic fingerprint.
      run_manifest_path:
        required: true
        title: Run manifest path
        description: Explicit path to the verified producing run manifest.
      run_manifest_sha256:
        required: true
        pattern: ^[0-9a-f]{64}$
        title: Run manifest sha256
        description: SHA-256 of the producing run manifest consumed by the analysis.
      consumer:
        required: true
        title: Consumer
        description: Identifier of the downstream analysis or presentation operation.
      product_ids:
        range: ProductDefinition
        multivalued: true
        required: true
        title: Product ids
        description: Product contracts explicitly consumed by this analysis.
      artifact_ids:
        range: ArtifactInstance
        multivalued: true
        required: true
        title: Artifact ids
        description: Concrete verified artifacts consumed by this analysis.
      feature_policy:
        required: true
        title: Feature policy
        description: Feature inclusion and identity policy.
      cohort:
        required: true
        title: Cohort
        description: Expected population selection policy.
      created_at:
        range: datetime
        required: true
        title: Created at
        description: UTC timestamp when this consumer record was created.
      coverage_path:
        required: true
        title: Coverage path
        description: Path to reconciled annotation coverage under the actual consumer feature filter.
      feature_filter_id:
        required: true
        pattern: '^sha256:[0-9a-f]{64}$'
        title: Feature filter id
        description: SHA-256 identity of the exact ordered retained analysis features.
      coverage_scope:
        required: true
        pattern: '^input_cohort_before_analysis_specific_exclusions$'
        title: Coverage scope
        description: Coverage describes the input cohort before analysis-specific eligibility exclusions.
      outputs:
        range: FileInventoryEntry
        multivalued: true
        inlined_as_list: true
        required: true
        title: Outputs
        description: Declared outputs; references are resolved and checked against their producers.
    title: Consumer Record
  LegacyImportRecord:
    description: Historical claims preserved without asserting a verified producing execution.
    attributes:
      id:
        identifier: true
        required: true
        title: Id
        description: Identifier unique within its containing document.
      source_path:
        required: true
        title: Source path
        description: Location of the historical source whose claims are being preserved.
      source_sha256:
        required: true
        pattern: ^[0-9a-f]{64}$
        title: Source sha256
        description: SHA-256 of the historical source bytes at import time.
      imported_at:
        range: datetime
        required: true
        title: Imported at
        description: UTC timestamp of legacy import, not the unknown historical execution time.
      verification_status:
        required: true
        pattern: ^imported_unverified$
        title: Verification status
        description: Explicitly unverified historical execution; byte integrity alone is insufficient.
      claims_json:
        required: true
        title: Claims json
        description: Original historical claims preserved as JSON without inventing executed steps.
    title: Legacy Import Record
  ArchivedLocation:
    title: Archived Location
    description: Original file or collection locations mapped to one immutable retained copy.
    attributes:
      original_paths:
        title: Original paths
        description: Absolute recorded locations, including any declared input alias; never rewritten in source records.
        multivalued: true
        required: true
      archive_path:
        title: Archive path
        description: Safe relative location inside the archive, independent of its current root directory.
        required: true
      storage_kind:
        title: Storage kind
        description: File or collection storage contract for the retained copy.
        range: StorageKind
        required: true
      sha256:
        title: Sha256
        description: File digest or canonical collection inventory digest.
        pattern: ^[0-9a-f]{64}$
        required: true
      size_bytes:
        title: Size bytes
        description: Total bytes of retained regular files.
        range: integer
        minimum_value: 0
        required: true
      inventory:
        title: Inventory
        description: Complete regular-file inventory, including hidden members.
        range: FileInventoryEntry
        multivalued: true
        inlined_as_list: true
        required: true
  EvidenceArchive:
    title: Evidence Archive
    description: Retained bytes and explicit location mappings; archival verification does not invent historical execution or authorship.
    attributes:
      id:
        title: Id
        description: Unique archive identifier.
        identifier: true
        required: true
      archive_version:
        title: Archive version
        description: Version of the retention and verification contract.
        pattern: ^1$
        required: true
      created_at:
        title: Created at
        description: UTC archival time, distinct from original execution times.
        range: datetime
        required: true
      core_manifests:
        title: Core manifests
        description: Original absolute locations of retained core runs whose full scientific contracts are revalidated.
        multivalued: true
        required: true
      consumer_records:
        title: Consumer records
        description: Original absolute locations of consumer records whose output and core bindings are revalidated.
        multivalued: true
      retained_paths:
        title: Retained paths
        description: Explicit supplemental evidence preserved by byte identity; preservation alone does not validate its scientific claims.
        multivalued: true
      locations:
        title: Locations
        description: Complete hash-checked source-to-retained-location mapping.
        range: ArchivedLocation
        multivalued: true
        inlined_as_list: true
        required: true
  RecordedPath:
    description: Observed file or directory snapshot; member bytes remain independently checkable.
    title: Recorded Path
    attributes:
      path:
        required: true
        title: Path
        description: Absolute location observed during execution.
      storage_kind:
        range: StorageKind
        required: true
        title: Storage kind
        description: File or directory snapshot.
      sha256:
        required: true
        pattern: ^[0-9a-f]{64}$
        title: Sha256
        description: File checksum or canonical inventory checksum.
      size_bytes:
        range: integer
        minimum_value: 0
        required: true
        title: Size bytes
        description: Observed total file size.
      inventory:
        range: FileInventoryEntry
        multivalued: true
        inlined_as_list: true
        required: true
        title: Inventory
        description: Exact members observed at this stage; later stages may add directory members.
  ArmCommandDefinition:
    description: Explicit command and required file contracts for one downstream stage.
    title: Arm Command Definition
    attributes:
      id:
        required: true
        pattern: ^[A-Za-z][A-Za-z0-9_.-]*$
        title: Id
        description: Unique stage identifier within the arm.
      argv:
        multivalued: true
        required: true
        title: Argv
        description: Exact argument vector executed without a shell.
      inputs:
        multivalued: true
        title: Inputs
        description: Required input paths, explicitly bound to core or earlier stage products.
      outputs:
        multivalued: true
        required: true
        title: Outputs
        description: Required output files or inventoried directories.
  ArmCommandExecution:
    description: An attempted command with observed bytes and exit status.
    title: Arm Command Execution
    attributes:
      id:
        required: true
        title: Id
        description: Corresponding command definition identifier.
      status:
        range: ExecutionStatus
        required: true
        title: Status
        description: Actual execution state; failed or running stages are never complete.
      started_at:
        range: datetime
        required: true
        title: Started at
        description: UTC start time.
      ended_at:
        range: datetime
        title: Ended at
        description: UTC completion or failure time.
      exit_code:
        range: integer
        title: Exit code
        description: Actual process exit code when a process was started.
      inputs:
        range: RecordedPath
        multivalued: true
        inlined_as_list: true
        title: Inputs
        description: Observed input snapshots before execution.
      outputs:
        range: RecordedPath
        multivalued: true
        inlined_as_list: true
        title: Outputs
        description: Observed required outputs after successful execution.
      log:
        range: RecordedPath
        inlined: true
        title: Log
        description: Captured process output and its checksum.
      error:
        title: Error
        description: Failure diagnostic, if any.
  ArmRun:
    description: Execution-generated downstream rerun bound to a verified core bundle.
    title: Arm Run
    attributes:
      id:
        identifier: true
        required: true
        title: Id
        description: Unique attempt identifier.
      arm:
        required: true
        pattern: ^(ilyas|noel|jed)$
        title: Arm
        description: Owner of the declared standard analysis suite.
      contrast_population:
        range: ContrastPopulation
        ifabsent: string(all_paired)
        title: Contrast population
        description: Selection inherited from the verified upstream core, never independently overridden.
      direction_basis:
        range: DirectionBasis
        ifabsent: string(group_1_vs_group_0)
        title: Direction basis
        description: Upstream direction semantics; disease-oriented inputs must not be reversed a second time.
      scope:
        required: true
        pattern: ^standard_analysis_calibration_and_optional_figures$
        title: Scope
        description: Explicit scope; historical PD and presentation investigations are separate.
      status:
        range: ExecutionStatus
        required: true
        title: Status
        description: Actual attempt status.
      started_at:
        range: datetime
        required: true
        title: Started at
        description: UTC start time.
      ended_at:
        range: datetime
        title: Ended at
        description: UTC completion or failure time.
      manifest_path:
        required: true
        title: Manifest path
        description: Absolute location of this execution record.
      core_manifest_path:
        required: true
        title: Core manifest path
        description: Verified upstream run manifest.
      core_manifest_sha256:
        required: true
        pattern: ^[0-9a-f]{64}$
        title: Core manifest sha256
        description: Upstream manifest checksum before execution.
      core_run_id:
        required: true
        title: Core run id
        description: Upstream execution identity.
      profile_product:
        required: true
        pattern: ^(count_profiles|ora_profiles)$
        title: Profile product
        description: Scientific count unit used by the primary analysis.
      plan_sha256:
        required: true
        pattern: ^[0-9a-f]{64}$
        title: Plan sha256
        description: Canonical checksum of the complete ordered command definitions.
      git_commit:
        required: true
        title: Git commit
        description: Actual checkout revision.
      git_dirty:
        range: boolean
        required: true
        title: Git dirty
        description: Whether the checkout contained local changes at start.
      code_inventory:
        range: FileInventoryEntry
        multivalued: true
        inlined_as_list: true
        required: true
        title: Code inventory
        description: Actual source, schema, methods and workflow configuration bytes.
      repository_path:
        required: true
        title: Repository path
        description: Source checkout used to execute the commands.
      runtime_json:
        required: true
        title: Runtime json
        description: Python, platform, package versions and explicitly controlled process settings.
      parameters:
        range: ParameterValue
        multivalued: true
        inlined_as_list: true
        required: true
        title: Parameters
        description: Resolved arm options; absent overrides preserve stage-specific defaults.
      prepared_inputs:
        range: RecordedPath
        multivalued: true
        inlined_as_list: true
        title: Prepared inputs
        description: Fresh byte-identical copies of verified core products under canonical filenames.
      plan:
        range: ArmCommandDefinition
        multivalued: true
        inlined_as_list: true
        required: true
        title: Plan
        description: Complete ordered command plan recorded before execution.
      steps:
        range: ArmCommandExecution
        multivalued: true
        inlined_as_list: true
        title: Steps
        description: Commands actually attempted in order.
      outputs:
        range: FileInventoryEntry
        multivalued: true
        inlined_as_list: true
        title: Outputs
        description: Exact final output-tree inventory excluding this manifest and its temporary write.
      error:
        title: Error
        description: Failure diagnostic; no failed attempt can verify as completed.
  AnalysisSpec:
    description: Shared executable specification of estimand, kernel, transformation, sampling unit, weighting, and eligibility.
    title: Analysis Spec
    attributes:
      id:
        identifier: true
        required: true
        pattern: ^[A-Za-z][A-Za-z0-9_:.-]*$
        title: Id
        description: Stable analysis specification identifier shared by production, calibration, and sensitivity evaluations.
      estimand:
        required: true
        title: Estimand
        description: Scientific quantity estimated by the analysis.
      kernel:
        required: true
        title: Kernel
        description: Statistical test or summary kernel applied to observations.
      transformation:
        required: true
        title: Transformation
        description: Scale transformation applied before aggregation or testing.
      sampling_unit:
        required: true
        title: Sampling unit
        description: Observational unit at which independent or paired records are evaluated.
      weighting:
        required: true
        title: Weighting
        description: Observation or study weighting rule.
      eligibility_rule:
        required: true
        title: Eligibility rule
        description: Rule determining which contrasts, studies, or signatures enter the denominator.
      multiple_testing_policy:
        required: true
        title: Multiple testing policy
        description: Multiplicity correction procedure and family scope.
  EligibilityLedger:
    description: Explicit accounting of included sampling units, exclusion reasons, and common-support counts.
    title: Eligibility Ledger
    attributes:
      id:
        identifier: true
        required: true
        title: Id
        description: Unique eligibility ledger identifier.
      analysis_spec_id:
        range: AnalysisSpec
        required: true
        title: Analysis spec id
        description: Analysis specification whose eligibility rules produced this ledger.
      contrast_population:
        range: ContrastPopulation
        required: true
        title: Contrast population
        description: Upstream contrast population before analysis-specific eligibility filtering.
      included_count:
        range: integer
        minimum_value: 0
        required: true
        title: Included count
        description: Number of sampling units retained after eligibility filtering.
      excluded_count:
        range: integer
        minimum_value: 0
        required: true
        title: Excluded count
        description: Number of candidate sampling units excluded by the eligibility rule.
      included_ids:
        multivalued: true
        title: Included ids
        description: Deterministic sorted identifiers of included sampling units.
      exclusion_counts_json:
        required: true
        title: Exclusion counts json
        description: Canonical JSON mapping each exclusion reason code to its count.
      common_support_count:
        range: integer
        minimum_value: 0
        title: Common support count
        description: Number of sampling units shared with a paired comparator specification when evaluated on common support.
  AnalysisBasis:
    description: Feature catalog, vocabulary filter, rollup policy, denominator, background universe, and weighting basis.
    title: Analysis Basis
    attributes:
      id:
        identifier: true
        required: true
        title: Id
        description: Unique analysis basis identifier.
      feature_catalog_sha256:
        required: true
        pattern: ^[0-9a-f]{64}$
        title: Feature catalog sha256
        description: SHA-256 of the authoritative trait feature catalog.
      feature_filter_id:
        required: true
        pattern: '^sha256:[0-9a-f]{64}$'
        title: Feature filter id
        description: SHA-256 identity of the exact ordered retained analysis features.
      retained_feature_count:
        range: integer
        minimum_value: 0
        required: true
        title: Retained feature count
        description: Number of retained qualified trait features in the analysis family.
      profile_unit:
        required: true
        pattern: ^(count_profiles|ora_profiles)$
        title: Profile unit
        description: Underlying profile representation unit.
      aggregation_policy:
        required: true
        title: Aggregation policy
        description: How taxon-level annotations are aggregated into signature, contrast, or study summaries.
      rollup_policy:
        required: true
        title: Rollup policy
        description: Taxonomic trait inheritance and strain rollup policy.
      denominator_policy:
        required: true
        title: Denominator policy
        description: Denominator definition for fractions, ratios, or hypergeometric backgrounds.
      background_inventory_id:
        required: true
        title: Background inventory id
        description: Identifier or digest of the background taxon universe when applicable.
      weighting_policy:
        required: true
        title: Weighting policy
        description: Study, contrast, or taxon weighting policy.
  CalibrationVerdict:
    description: Standardized calibration assessment binding the evaluated harness specification to the production estimator.
    title: Calibration Verdict
    attributes:
      id:
        identifier: true
        required: true
        title: Id
        description: Unique calibration verdict identifier.
      production_analysis_spec_id:
        range: AnalysisSpec
        required: true
        title: Production analysis spec id
        description: Analysis specification of the production estimator being assessed.
      evaluated_analysis_spec_id:
        range: AnalysisSpec
        required: true
        title: Evaluated analysis spec id
        description: Analysis specification actually executed by the calibration harness.
      estimator_match:
        range: boolean
        required: true
        title: Estimator match
        description: Whether the calibration harness evaluated the exact production AnalysisSpec.
      outcome:
        range: CalibrationOutcome
        required: true
        title: Outcome
        description: Standardized calibration classification across arms.
      null_control_passed:
        range: boolean
        title: Null control passed
        description: Whether empirical type-I error and null FDR stayed within declared tolerances.
      power_passed:
        range: boolean
        title: Power passed
        description: Whether empirical power under the declared injected effect met the minimum threshold.
      replicate_budget_sufficient:
        range: boolean
        required: true
        title: Replicate budget sufficient
        description: Whether the executed replicate count met the protocol minimum.
      summary_message:
        required: true
        title: Summary message
        description: Human-readable explanation of the calibration verdict and any estimator mismatch.
      negative_control_procedure:
        title: Negative control procedure
        description: Harness procedure declared in advance to fail the acceptance criteria, recorded apart from the production procedure's own error control.
      negative_control_outcome:
        title: Negative control outcome
        description: Overall status the calibration harness reported for the negative control procedure.
      negative_control_as_expected:
        range: boolean
        title: Negative control as expected
        description: Whether the negative control failed, as declared, every criterion the production verdict relies on. False means it passed one, which is then too weak to certify the production procedure; unset means its run did not settle it.
      selection_uncertainty:
        title: Selection uncertainty
        description: Uncertainty from selecting the analysed features on the same corpus, which calibrating the fixed-feature procedure does not resolve in either direction.
  ScientificResultRecord:
    description: Standardized scientific result row bound to explicit analysis specification, eligibility ledger, and basis contracts.
    title: Scientific Result Record
    attributes:
      id:
        identifier: true
        required: true
        title: Id
        description: Unique scientific result record identifier.
      contrast_population:
        range: ContrastPopulation
        required: true
        title: Contrast population
        description: Executed experiment selection policy.
      direction_basis:
        range: DirectionBasis
        required: true
        title: Direction basis
        description: Meaning of increased and decreased in the consumed core products.
      analysis_spec_id:
        range: AnalysisSpec
        required: true
        title: Analysis spec id
        description: Reference to the exact AnalysisSpec used to compute this result.
      eligibility_ledger_id:
        range: EligibilityLedger
        required: true
        title: Eligibility ledger id
        description: Reference to the EligibilityLedger recording included and excluded units.
      analysis_basis_id:
        range: AnalysisBasis
        required: true
        title: Analysis basis id
        description: Reference to the AnalysisBasis recording feature vocabulary, rollup, and denominator rules.
      calibration_verdict_id:
        range: CalibrationVerdict
        title: Calibration verdict id
        description: Reference to the CalibrationVerdict for this estimator, if assessed.
      feature_id:
        required: true
        title: Feature id
        description: Qualified trait identifier or pair identifier, never a bare display label.
      feature_label:
        required: true
        title: Feature label
        description: Human-readable display label associated with the qualified feature identifier.
      effect_estimate:
        range: float
        title: Effect estimate
        description: Primary point estimate on the scale declared by the AnalysisSpec.
      effect_scale:
        required: true
        title: Effect scale
        description: Scale and orientation of the point estimate.
      p_value:
        range: float
        title: P value
        description: Raw two-sided or one-sided p-value as declared by the AnalysisSpec.
      q_value:
        range: float
        title: Q value
        description: Multiplicity-adjusted q-value within the declared family scope.
      effective_q_value:
        range: float
        title: Effective q value
        description: Eigenvalue-effective family-size adjusted q-value when applicable.
      n_eligible:
        range: integer
        minimum_value: 0
        required: true
        title: N eligible
        description: Number of eligible sampling units contributing to this test.
      positive_count:
        range: integer
        minimum_value: 0
        title: Positive count
        description: Count of positive shifts or enriched signatures.
      negative_count:
        range: integer
        minimum_value: 0
        title: Negative count
        description: Count of negative shifts or depleted signatures.
      tie_or_zero_count:
        range: integer
        minimum_value: 0
        title: Tie or zero count
        description: Count of exact ties or zero-total excluded units.
  ComparisonRun:
    description: Complete cross-arm integration record consuming verified core, Noel, Jed, and Ilyas arm manifests without missing-source placeholders.
    title: Comparison Run
    attributes:
      id:
        identifier: true
        required: true
        title: Id
        description: Unique cross-arm comparison attempt identifier.
      contrast_population:
        range: ContrastPopulation
        required: true
        title: Contrast population
        description: Shared contrast population verified across core and all three arms.
      direction_basis:
        range: DirectionBasis
        required: true
        title: Direction basis
        description: Shared direction basis verified across core and all three arms.
      status:
        range: ExecutionStatus
        required: true
        title: Status
        description: Explicit lifecycle outcome of the cross-arm comparison run.
      started_at:
        range: datetime
        required: true
        title: Started at
        description: UTC timestamp when the cross-arm integration began.
      ended_at:
        range: datetime
        title: Ended at
        description: UTC timestamp when the cross-arm integration finished or failed.
      manifest_path:
        required: true
        title: Manifest path
        description: Absolute location of this ComparisonRun manifest.
      core_manifest_path:
        required: true
        title: Core manifest path
        description: Verified upstream core run manifest path.
      core_manifest_sha256:
        required: true
        pattern: ^[0-9a-f]{64}$
        title: Core manifest sha256
        description: SHA-256 of the verified upstream core run manifest.
      core_run_id:
        required: true
        title: Core run id
        description: Verified upstream core run identifier shared by all three arms.
      noel_manifest_path:
        required: true
        title: Noel manifest path
        description: Verified Noel ArmRun manifest path.
      noel_manifest_sha256:
        required: true
        pattern: ^[0-9a-f]{64}$
        title: Noel manifest sha256
        description: SHA-256 of the verified Noel ArmRun manifest.
      jed_manifest_path:
        required: true
        title: Jed manifest path
        description: Verified Jed ArmRun manifest path.
      jed_manifest_sha256:
        required: true
        pattern: ^[0-9a-f]{64}$
        title: Jed manifest sha256
        description: SHA-256 of the verified Jed ArmRun manifest.
      ilyas_manifest_path:
        required: true
        title: Ilyas manifest path
        description: Verified Ilyas ArmRun manifest path.
      ilyas_manifest_sha256:
        required: true
        pattern: ^[0-9a-f]{64}$
        title: Ilyas manifest sha256
        description: SHA-256 of the verified Ilyas ArmRun manifest.
      git_commit:
        required: true
        title: Git commit
        description: Repository commit at execution start.
      git_dirty:
        range: boolean
        required: true
        title: Git dirty
        description: Whether tracked or untracked changes existed at execution start.
      analysis_specs:
        range: AnalysisSpec
        multivalued: true
        inlined_as_list: true
        required: true
        title: Analysis specs
        description: Declared AnalysisSpec contracts evaluated or compared in this run.
      eligibility_ledgers:
        range: EligibilityLedger
        multivalued: true
        inlined_as_list: true
        required: true
        title: Eligibility ledgers
        description: Eligibility ledgers for each evaluated analysis specification.
      analysis_bases:
        range: AnalysisBasis
        multivalued: true
        inlined_as_list: true
        required: true
        title: Analysis bases
        description: Feature, rollup, denominator, and background bases for each arm.
      calibration_verdicts:
        range: CalibrationVerdict
        multivalued: true
        inlined_as_list: true
        required: true
        title: Calibration verdicts
        description: Standardized calibration verdicts with explicit estimator-match checks.
      outputs:
        range: FileInventoryEntry
        multivalued: true
        inlined_as_list: true
        required: true
        title: Outputs
        description: Complete output file inventory produced by the cross-arm comparison stage.
      error:
        title: Error
        description: Failure diagnostic if the comparison run failed.
