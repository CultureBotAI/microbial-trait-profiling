id: https://w3id.org/mtp/schema
name: mtp
title: Microbial Trait Profiling Schema
description: >-
  LinkML schema for normalized BugSigDB studies, experiments, signatures,
  and taxa.
license: MIT
default_prefix: mtp
default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  mtp: https://w3id.org/mtp/
  bsdbng: https://w3id.org/bsdbng/
  bsdb: https://bugsigdb.org/Study_
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  METPO: http://purl.obolibrary.org/obo/METPO_
  CHEBI: http://purl.obolibrary.org/obo/CHEBI_
  ENVO: http://purl.obolibrary.org/obo/ENVO_
  UBERON: http://purl.obolibrary.org/obo/UBERON_
  EFO: http://identifiers.org/efo/
  biolink: https://w3id.org/biolink/vocab/

imports:
  - linkml:types

classes:
  NamedThing:
    abstract: true
    title: Named Thing
    description: >-
      An entity with a stable identifier. All identifiable classes in
      this schema inherit from NamedThing.
    slots:
      - id

  Study:
    is_a: NamedThing
    tree_root: true
    title: Study
    description: >-
      One published microbiome study from which BugSigDB collects and
      standardizes microbial signatures.
    id_prefixes:
      - bsdb
    slots:
      - source_record_id
      - pmid
      - title
      - publication_year
      - doi
      - url
      - study_design
      - authors_list
      - journal
      - keywords
    attributes:
      experiments:
        title: Experiments
        description: Semantic experiment units recorded for the study.
        range: Experiment
        multivalued: true
        inlined_as_list: true
        required: true
    slot_usage:
      id:
        pattern: "^bsdb:.+$"
        description: >-
          BugSigDB study identifier. Usually numeric (e.g. bsdb:10202341)
          but some entries use DOIs or PMC IDs (e.g. bsdb:PMC11017998).

  Experiment:
    is_a: NamedThing
    title: Experiment
    description: >-
      One semantic unit within a study that records contrasted sample groups
      and key metadata relevant to differential abundance findings.
    id_prefixes:
      - bsdb
    slots:
      - experiment_name
      - location_of_subjects
      - host_species
      - body_site
      - body_site_ontology_id
      - condition
      - condition_ontology_id
      - group_0_name
      - group_1_name
      - group_1_definition
      - group_0_sample_size
      - group_1_sample_size
      - antibiotics_exclusion
      - sequencing_type
      - variable_region_16s
      - sequencing_platform
      - data_transformation
      - statistical_test
      - significance_threshold
      - mht_correction
      - lda_score_above
      - matched_on
      - confounders_controlled_for
      - pielou
      - shannon
      - chao1
      - simpson
      - inverse_simpson
      - richness
    attributes:
      signatures:
        title: Signatures
        description: Signatures associated with the experiment.
        range: Signature
        multivalued: true
        inlined_as_list: true
        required: true
    slot_usage:
      id:
        pattern: "^bsdb:.+-[0-9]+$"
        description: BugSigDB experiment identifier, e.g. bsdb:10202341-1.

  Signature:
    is_a: NamedThing
    title: Signature
    description: >-
      A microbial signature represented as an unordered set of taxa sharing
      a common property or response to a study condition.
    id_prefixes:
      - bsdb
    slots:
      - direction
      - signature_source
      - signature_description
    attributes:
      taxa:
        title: Taxa
        description: Taxa listed in the signature.
        range: Taxon
        multivalued: true
        inlined_as_list: true
        required: true
    slot_usage:
      id:
        pattern: "^bsdb:.+-[0-9]+-[0-9]+$"
        description: BugSigDB signature identifier, e.g. bsdb:10202341-1-1.
      direction:
        required: true

  Taxon:
    is_a: NamedThing
    title: Taxon
    description: >-
      A taxonomic unit of any rank designating a microbial organism or group
      of microbial organisms.
    id_prefixes:
      - NCBITaxon
    slots:
      - taxon_name
      - taxonomic_rank
    slot_usage:
      id:
        pattern: "^NCBITaxon:[0-9]+$"
        description: NCBITaxon CURIE, e.g. NCBITaxon:9606.
        recommended: true
        required: false
      taxon_name:
        required: true
      taxonomic_rank:
        recommended: true
        required: false

  # --- KG-Microbe phenotype and trait entities ---

  Node:
    title: KG-Microbe Node
    description: >-
      A node in the KG-Microbe knowledge graph. Nodes can represent taxa,
      phenotypes, traits, chemicals, environments, or other entities.
    slots:
      - id
      - category
      - name
      - xref
      - provided_by
      - synonym
    slot_usage:
      id:
        identifier: true
        required: true
      category:
        required: true

  Edge:
    title: KG-Microbe Edge
    description: >-
      An edge or relationship in the KG-Microbe knowledge graph connecting
      two nodes.
    slots:
      - edge_id
      - subject
      - predicate
      - object
      - relation
      - provided_by
    slot_usage:
      subject:
        required: true
      predicate:
        required: true
      object:
        required: true

  Phenotype:
    title: KG-Microbe Phenotype
    description: >-
      A microbial phenotype or trait from the microbial phenotypes ontology
      associated with a taxon in KG-Microbe.
    slots:
      - phenotype_id
      - phenotype_name
      - count
      - from_descendants
    slot_usage:
      phenotype_id:
        required: true

  KgTraitAssertion:
    title: KG-Microbe Trait Assertion
    description: >-
      Normalized representation of one dynamic trait column in the taxa-by-traits
      matrix. Direct phenotype columns use a METPO object such as
      METPO:1000615. Relation-value columns combine a METPO predicate with a
      specific KG object, such as METPO:2000006 plus a CHEBI carbon source or
      METPO:2000517 plus a MediaDive growth medium.
    slots:
      - trait_assertion_id
      - trait_label
      - predicate_id
      - predicate_name
      - object_id
      - object_name
      - object_category
      - count
      - from_descendants
    slot_usage:
      trait_assertion_id:
        required: true
      object_id:
        required: true
      count:
        required: true

  TaxonTraitMatrixRow:
    title: Taxon Trait Matrix Row
    description: >-
      One BugSigDB-reported taxon row in a taxa-by-traits matrix. Trait
      columns in the generated TSV are dynamic KG-Microbe phenotype or trait
      assertion labels; the trait_counts slot provides the normalized
      representation of the same counts.
    slots:
      - taxon_id
      - taxon_name
      - taxonomic_rank
      - trait_counts
    slot_usage:
      taxon_id:
        required: true
      taxon_name:
        required: true

slots:
  id:
    identifier: true
    required: true
    title: ID
    description: Stable identifier for this entity.

  # --- Study slots ---

  source_record_id:
    title: Source Record ID
    description: Study identifier exactly as exported by BugSigDB.
    range: string
    required: true

  pmid:
    title: PMID
    description: PubMed identifier for the study.
    range: integer
    minimum_value: 1

  title:
    title: Title
    description: Study title.
    range: string

  publication_year:
    title: Publication Year
    description: Publication year.
    range: integer
    minimum_value: 1900
    maximum_value: 2100

  doi:
    title: DOI
    description: Digital object identifier for the study.
    range: string
    pattern: "^10\\..+$"

  url:
    title: URL
    description: Stable URL for the study when no DOI or PMID is available.
    range: uri

  study_design:
    title: Study Design
    description: Study design type (e.g. case-control, cross-sectional, meta-analysis).
    range: string

  authors_list:
    title: Authors List
    description: Author list as provided by BugSigDB.
    range: string

  journal:
    title: Journal
    description: Journal of publication.
    range: string

  keywords:
    title: Keywords
    description: Keywords associated with the study.
    range: string

  # --- Experiment slots ---

  experiment_name:
    title: Experiment Name
    description: Label for the experiment.
    range: string

  location_of_subjects:
    title: Location of Subjects
    description: Geographic location of study subjects.
    range: string

  host_species:
    title: Host Species
    description: Host organism species (e.g. Homo sapiens, Mus musculus).
    range: string

  body_site:
    title: Body Site
    description: Anatomical site of sample collection (e.g. stool, skin, oral cavity).
    range: string

  body_site_ontology_id:
    title: Body Site Ontology ID
    description: UBERON ontology term(s) for the body site (e.g. UBERON:0001988).
    aliases:
      - UBERON ID
    range: string
    pattern: "^UBERON:[0-9]+$"
    multivalued: true

  condition:
    title: Condition
    description: Disease or condition under study (e.g. obesity, colorectal cancer).
    range: string

  condition_ontology_id:
    title: Condition Ontology ID
    description: >-
      Ontology term(s) for the condition. BugSigDB labels this column "EFO ID"
      but it contains CURIEs from multiple ontologies including EFO, MONDO,
      HP, CHEBI, GO, and others.
    aliases:
      - EFO ID
    range: string
    multivalued: true

  group_0_name:
    title: Group 0 Name
    description: Label for the control or reference sample group.
    range: string

  group_1_name:
    title: Group 1 Name
    description: Label for the case or experimental sample group.
    range: string

  group_1_definition:
    title: Group 1 Definition
    description: Detailed definition of the case group.
    range: string

  group_0_sample_size:
    title: Group 0 Sample Size
    description: Number of subjects in the control group.
    range: integer
    minimum_value: 0

  group_1_sample_size:
    title: Group 1 Sample Size
    description: Number of subjects in the case group.
    range: integer
    minimum_value: 0

  antibiotics_exclusion:
    title: Antibiotics Exclusion
    description: Whether subjects on antibiotics were excluded.
    range: string

  sequencing_type:
    title: Sequencing Type
    description: Sequencing approach (e.g. 16S, shotgun, metatranscriptomics).
    range: string

  variable_region_16s:
    title: 16S Variable Region
    description: Targeted 16S rRNA variable region (e.g. V4, V3V4).
    range: string

  sequencing_platform:
    title: Sequencing Platform
    description: Sequencing platform used (e.g. Illumina, Ion Torrent).
    range: string

  data_transformation:
    title: Data Transformation
    description: Data normalization or transformation applied (e.g. relative abundances).
    range: string

  statistical_test:
    title: Statistical Test
    description: Statistical test used for differential abundance (e.g. Mann-Whitney, DESeq2).
    range: string

  significance_threshold:
    title: Significance Threshold
    description: P-value or FDR threshold used for significance.
    range: float

  mht_correction:
    title: MHT Correction
    description: Multiple hypothesis testing correction method (e.g. BH, Bonferroni).
    range: string

  lda_score_above:
    title: LDA Score Above
    description: LEfSe LDA score threshold if applicable.
    range: float

  matched_on:
    title: Matched On
    description: Variables on which groups were matched (e.g. age, BMI).
    range: string

  confounders_controlled_for:
    title: Confounders Controlled For
    description: Confounders accounted for in the analysis.
    range: string

  pielou:
    title: Pielou Evenness
    description: Direction of change in Pielou's evenness index between groups.
    range: DiversityDirectionEnum

  shannon:
    title: Shannon Diversity
    description: Direction of change in Shannon diversity index between groups.
    range: DiversityDirectionEnum

  chao1:
    title: Chao1 Richness
    description: Direction of change in Chao1 richness estimator between groups.
    range: DiversityDirectionEnum

  simpson:
    title: Simpson Index
    description: Direction of change in Simpson diversity index between groups.
    range: DiversityDirectionEnum

  inverse_simpson:
    title: Inverse Simpson
    description: Direction of change in inverse Simpson index between groups.
    range: DiversityDirectionEnum

  richness:
    title: Richness
    description: Direction of change in observed species richness between groups.
    range: DiversityDirectionEnum

  # --- Signature slots ---

  direction:
    title: Direction
    description: Reported direction of abundance change for taxa in the signature.
    range: DirectionEnum
    required: true

  signature_source:
    title: Source
    description: Source of the signature within the publication (e.g. Table S6, Figure 3).
    range: string

  signature_description:
    title: Description
    description: Free-text description of the signature from BugSigDB curators.
    range: string

  # --- Taxon slots ---

  taxon_name:
    title: Taxon Name
    description: Reported taxon label.
    range: string

  taxonomic_rank:
    title: Taxonomic Rank
    description: Taxonomic rank of the reported taxon.
    range: TaxonomicRankEnum

  # --- KG-Microbe phenotype and trait slots ---

  category:
    title: Category
    description: Biolink category of a KG-Microbe node.
    range: string

  name:
    title: Name
    description: Human-readable node label.
    range: string

  xref:
    title: Cross Reference
    description: Cross-reference to another database.
    range: string
    multivalued: true

  provided_by:
    title: Provided By
    description: Data source or provenance for a node or edge.
    range: string
    multivalued: true

  synonym:
    title: Synonym
    description: Alternative node label.
    range: string
    multivalued: true

  edge_id:
    title: Edge ID
    description: Stable identifier for a KG-Microbe edge.
    range: string

  subject:
    title: Subject
    description: Subject node of a KG-Microbe relationship.
    range: string

  predicate:
    title: Predicate
    description: Relationship predicate.
    range: string

  object:
    title: Object
    description: Object node of a KG-Microbe relationship.
    range: string

  relation:
    title: Relation
    description: Ontology relation term supporting the predicate.
    range: string

  taxon_id:
    title: Taxon ID
    description: NCBITaxon identifier for a matrix row.
    range: string
    pattern: "^NCBITaxon:[0-9]+$"

  phenotype_id:
    title: Phenotype ID
    description: METPO phenotype or trait identifier.
    range: string
    pattern: "^METPO:[0-9]+$"

  phenotype_name:
    title: Phenotype Name
    description: Human-readable phenotype or trait label.
    range: string

  trait_assertion_id:
    title: Trait Assertion ID
    description: >-
      Stable key for a generated trait matrix column. Direct METPO phenotype
      columns use the METPO object CURIE; relation-value columns combine the
      predicate and object identifiers.
    range: string

  trait_label:
    title: Trait Label
    description: Human-readable label for a generated trait matrix column.
    range: string

  predicate_id:
    title: Predicate ID
    description: >-
      Predicate used by the KG-Microbe assertion. Direct phenotype assertions
      may use biolink:has_phenotype, while relation-value assertions use METPO
      predicates such as METPO:2000006, METPO:2000103, or METPO:2000517.
    range: string

  predicate_name:
    title: Predicate Name
    description: Human-readable predicate label.
    range: string

  object_id:
    title: Object ID
    description: >-
      KG object identifier for a trait assertion. This may be a METPO phenotype,
      CHEBI chemical, GO process, pathway identifier, MediaDive medium, or other
      KG-Microbe object.
    range: string

  object_name:
    title: Object Name
    description: Human-readable object label.
    range: string

  object_category:
    title: Object Category
    description: Biolink category of the KG object.
    range: string

  count:
    title: Count
    description: Number of taxa at or below a row taxon that have the trait assertion.
    range: integer
    minimum_value: 0

  from_descendants:
    title: From Descendants
    description: Whether the trait assertion count includes descendant taxa.
    range: boolean

  trait_counts:
    title: Trait Counts
    description: Normalized KG-Microbe trait assertion counts for a matrix row.
    range: KgTraitAssertion
    multivalued: true
    inlined_as_list: true

enums:
  DirectionEnum:
    title: Direction values
    description: Allowed values for reported abundance direction.
    permissible_values:
      increased:
      decreased:

  DiversityDirectionEnum:
    title: Diversity direction values
    description: >-
      Reported direction of change in an alpha diversity metric
      between the two sample groups.
    permissible_values:
      increased:
      decreased:
      unchanged:

  TaxonomicRankEnum:
    title: Taxonomic rank values
    description: Allowed taxonomic rank values for normalized BugSigDB taxa.
    permissible_values:
      strain:
      species:
      subspecies:
      isolate:
      genus:
      family:
      order:
      class:
      phylum:
      superkingdom:

  BiolinkCategoryEnum:
    title: Biolink category values
    description: Common Biolink categories used by KG-Microbe nodes.
    permissible_values:
      biolink:OrganismTaxon:
        description: A taxonomic grouping of organisms.
      biolink:Phenotype:
        description: An observable characteristic or trait.
      biolink:PhenotypicQuality:
        description: A phenotype quality term.
      biolink:OntologyClass:
        description: A general ontology class.
      biolink:ChemicalEntity:
        description: A chemical substance.
      biolink:SmallMolecule:
        description: A small molecule.
      biolink:Environment:
        description: An environment or habitat.
      biolink:BiologicalProcess:
        description: A biological process.
      biolink:MolecularActivity:
        description: A molecular function or activity.
      biolink:MacromolecularComplex:
        description: A macromolecular complex.
      biolink:Attribute:
        description: An attribute or quality.
      biolink:NamedThing:
        description: A generic named entity.

  BiolinkPredicateEnum:
    title: Biolink predicate values
    description: Common relationship predicates used by KG-Microbe edges.
    permissible_values:
      biolink:subclass_of:
        description: Taxonomic hierarchy relationship.
      biolink:has_phenotype:
        description: Taxon has a phenotype or trait.
      biolink:capable_of:
        description: Taxon is capable of an activity.
      biolink:interacts_with:
        description: Taxon interacts with an entity.
      biolink:produces:
        description: Taxon produces a substance.
      biolink:location_of:
        description: Environment is location of taxon.
      biolink:located_in:
        description: Taxon is located in an environment.
      biolink:affects:
        description: Taxon affects another entity.
      biolink:participates_in:
        description: Taxon participates in a process.
