[default]
# Figure acronym, statistical term, Cytoscape layout, and quoted study arm code.
# The last pattern skips hex digests (commit IDs, sha256 prefixes): typos splits them at
# digits and rewrote "16a0804caf056760" to "16a0804calf056760" in a review record (#1040).
extend-ignore-re = ['\bPNGs\b', '\bnonsignificant\b', '\bcose\b', '\bBA\b', '\b[0-9a-f]{7,}\b']

[default.extend-identifiers]
PNGs = "PNGs"

[default.extend-words]
nonsignificant = "nonsignificant"
# Without this, typos rewrites the `fac_aer` fixture prefix in
# tests/test_table1_trait_maps.py to `fac_are`.
# Aerobe abbreviation used in trait fixtures.
aer = "aer"
# BugSigDB grades oral mucositis as "Muc0-1" and "Muc2". Those group names are quoted
# verbatim in methods/contrast_orientation_review.tsv, and typos rewrites them to
# "Much0-1" and "Much2", which changes curated data into something the export does not
# contain.
muc = "muc"
# Bifidobacterium longum subsp. infantis. BugSigDB experiment labels quote it verbatim in the
# enrichment-infographic-followup READMEs, and typos rewrites it to "infants" (#586).
infantis = "infantis"

[files]
extend-exclude = ["uv.lock", ".venv"]
