[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtp"
version = "0.1.0"
description = "Integration and comparative analysis of microbial trait annotations"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  # Keep in step with CITATION.cff.
  { name = "Jed Dongjin Kim-Ozaeta" },
  { name = "Ilyas Abdolcader" },
  { name = "Noel Sason" },
  { name = "Anthea Guo" },
  { name = "Mark Andrew Miller" },
  { name = "Marcin P. Joachimiak" },
]
dependencies = [
  "gitpython>=3.2.1",
  "httpx>=0.28.0",
  "linkml>=1.11.0",
  "linkml-runtime>=1.8.3",
  # numpy arrives with scipy either way; it is declared because `mtp.enrichment_stats`
  # and `mtp.calibration` import it directly.
  "numpy>=2.0",
  "pandas>=3.0.6",
  "plotly>=7.1.0",
  "pydantic>=2.13.0",
  "pyyaml>=6.0.2",
  # scipy stays a runtime dependency on purpose (#288): the analysis modules
  # guild_maps, table1_trait_maps and trait_composition all import it at module
  # level, so it is not optional for anything except a bare ingest-only install,
  # and the repo's rule is that statistics come from scipy rather than being
  # hand-rolled (#135).
  "scipy>=1.17.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15.0",
  "pre-commit>=4.6.2",
  "pytest>=9.1.1",
  "ruff>=0.17.0",
  "types-PyYAML>=6.0.12.20260408",
]
kg = [
  "gdown>=6.0.0",
]
# Figure rendering only (#288). Installing the package for the ingest and schema
# side should not pull a headless-Chrome driver, and plotly is imported lazily
# inside the figure functions, so the analysis modules import without it.
# kaleido 1.x renders figures by driving a headless Chrome/Chromium (fetch a
# version-pinned copy with `just get-chrome`). The 0.2.x line bundled its own
# renderer, but plotly 7.0 removed the kaleido-v0 code path (6.x had only
# deprecated it), so with the plotly floor, kaleido must sit on the v1 line; the
# two floors are a pair.
# matplotlib, seaborn, pillow and defusedxml are imported only by the figure
# scripts under scripts/ and by mtp.cellulose_decr.figures, which no other module
# under src/ imports (#521, #631).
viz = [
  "defusedxml>=0.7.1",
  "kaleido>=1.0",
  "matplotlib>=3.10.0",
  "pillow>=12.0.0",
  "plotly>=7.1.0",
  "seaborn>=0.13.0",
]
mongo = [
  "linkml-store[llm,mongodb]>=0.3.0",
  "pymongo>=4.17.0",
  "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pandas-stubs>=3.0.5.260914",
  "pre-commit>=4.6.2",
  "pytest>=9.1.1",
  "pytest-cov>=6.0.0",
  "ruff>=0.17.0",
  "types-PyYAML>=6.0.12.20260408",
]
qa = [
  "bandit[toml]>=1.9.4",
  "deptry>=0.21.1",
  # Keep these maintenance CLIs aligned with .pre-commit-config.yaml.
  "detect-secrets==1.5.0",
  # Reproduce the historical Git-state audit and regression comparisons (#635).
  # Runtime provenance uses GitPython's native Git interface instead.
  "dulwich>=1.2.17",
  "pip-audit>=2.10.1",
  "pytest-cov>=6.0.0",
  "types-PyYAML>=6.0.12.20260408",
  "uv==0.13.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]
exclude = [
  "src/bsdbng/datamodel/bsdbng_pydantic.py",
  "src/mtp/datamodel/bsdbng_pydantic.py",
  "src/mtp/datamodel/mtp_pydantic.py",
  "src/mtp/datamodel/workflow_pydantic.py",
  "src/mtp/datamodel/core_products_pydantic.py",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "ARG",
  "PIE",
  "PT",
  "RUF",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
mypy_path = "src"
exclude = [
  "src/bsdbng/datamodel/bsdbng_pydantic\\.py$",
  "src/mtp/datamodel/.*_pydantic\\.py$",
]

# `exclude` only keeps the generated model out of the files mypy crawls; it is
# still followed as an import of datamodel, and on a cold cache its
# errors surface. Silencing them here keeps its types available to callers,
# which `follow_imports = "skip"` would not.
[[tool.mypy.overrides]]
module = [
  "bsdbng.datamodel.bsdbng_pydantic",
  "mtp.datamodel.mtp_pydantic",
  "mtp.datamodel.workflow_pydantic",
  "mtp.datamodel.core_products_pydantic",
]
ignore_errors = true

# pandas, scipy and plotly ship no type information; the repo's own code stays strict.
[[tool.mypy.overrides]]
module = ["pandas", "scipy.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration' --durations=5"
markers = [
  "integration: tests that require network access or external services",
]

[tool.coverage.run]
source = ["mtp", "bsdbng"]
omit = [
  "src/bsdbng/datamodel/bsdbng_pydantic.py",
  "src/mtp/datamodel/bsdbng_pydantic.py",
  "src/mtp/datamodel/mtp_pydantic.py",
  "src/mtp/datamodel/workflow_pydantic.py",
  "src/mtp/datamodel/core_products_pydantic.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 60

[tool.codespell]
skip = [
  ".venv",
  "uv.lock",
]
quiet-level = 3

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.deptry]
exclude = [
  ".venv",
  "tests",
  "src/bsdbng/datamodel",
  "src/mtp/datamodel",
]
ignore = [
  "DEP002",
]
