[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bsdbng"
version = "0.1.0"
description = "Integration and comparative analysis of microbial trait annotations"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Mark Miller" }
]
dependencies = [
  "httpx>=0.28.0",
  "linkml>=1.10.0",
  "linkml-runtime>=1.8.3",
  "pydantic>=2.13.0",
  "pyyaml>=6.0.2",
  # scipy stays a runtime dependency on purpose (#288): the analysis modules
  # guild_maps, table1_trait_maps and trait_composition all import it at module
  # level, so it is not optional for anything except a bare ingest-only install,
  # and the repo's rule is that statistics come from scipy rather than being
  # hand-rolled (#135).
  "scipy>=1.17.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15.0",
  "pre-commit>=4.2.0",
  "pytest>=8.3.5",
  "ruff>=0.15.10",
  "types-PyYAML>=6.0.12.20260408",
]
kg = [
  "gdown>=6.0.0",
]
# Figure rendering only (#288). Installing the package for the ingest and schema
# side should not pull a headless-Chrome driver, and plotly is imported lazily
# inside the figure functions, so the analysis modules import without it.
# kaleido 1.x renders figures by driving a headless Chrome/Chromium (fetch a
# version-pinned copy with `just get-chrome`). The 0.2.x line bundled its own
# renderer, but plotly 7.0 removed the kaleido-v0 code path (6.x had only
# deprecated it), so with the plotly floor, kaleido must sit on the v1 line; the
# two floors are a pair.
viz = [
  "kaleido>=1.0",
  "plotly>=7.0",
]
mongo = [
  "linkml-store[llm,mongodb]>=0.3.0",
  "pymongo>=4.17.0",
  "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pre-commit>=4.2.0",
  "pytest>=8.3.5",
  "pytest-cov>=6.0.0",
  "ruff>=0.15.10",
  "types-PyYAML>=6.0.12.20260408",
]
qa = [
  "bandit[toml]>=1.8.3",
  "deptry>=0.21.1",
  # Keep these maintenance CLIs aligned with .pre-commit-config.yaml.
  "detect-secrets==1.5.0",
  "pip-audit>=2.10.0",
  "pytest-cov>=6.0.0",
  "types-PyYAML>=6.0.12.20260408",
  "uv==0.11.15",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]
exclude = ["src/bsdbng/datamodel/bsdbng_pydantic.py"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "ARG",
  "PIE",
  "PT",
  "RUF",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
mypy_path = "src"
exclude = [
  "src/bsdbng/datamodel/bsdbng_pydantic\\.py$",
]

# `exclude` keeps the generated model out of the files mypy crawls; it is still
# followed as an import of bsdbng.datamodel, so its types stay available to
# callers. It carried an `ignore_errors = true` override as well, added in
# 05943e7 because the generated file reported errors on a cold cache. The
# current gen-pydantic output is clean under strict mode, so the blanket
# suppression was removed rather than narrowed (#288). `just check` runs
# typecheck on a cold cache in CI; if a future linkml release reintroduces
# errors here, fix the generation or name the specific codes - do not restore a
# module-wide ignore.

# scipy and plotly ship no type information; the repo's own code stays strict.
[[tool.mypy.overrides]]
module = ["scipy.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration' --durations=5"
markers = [
  "integration: tests that require network access or external services",
]

[tool.coverage.run]
source = ["bsdbng"]
omit = ["src/bsdbng/datamodel/bsdbng_pydantic.py"]

[tool.coverage.report]
show_missing = true
fail_under = 60

[tool.codespell]
skip = [
  ".venv",
  "uv.lock",
]
quiet-level = 3

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = []

[tool.deptry]
exclude = [
  ".venv",
  "tests",
  "src/bsdbng/datamodel",
]
ignore = [
  "DEP002",
]
