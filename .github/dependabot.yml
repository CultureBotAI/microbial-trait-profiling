version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # "uv" (not "pip") so each bump regenerates uv.lock as well as pyproject.toml;
  # CI syncs with `uv sync --locked` and fails on a stale lock (#420).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Both are pinned to match a hook rev in .pre-commit-config.yaml, which
      # the uv ecosystem does not bump. Bump them by hand, together with the
      # hook rev (tests/test_tool_pins.py checks they agree). Deliberately, this
      # also suppresses their Dependabot security PRs. Both the pre-commit
      # `pip-audit` hook and `just security` include the qa group and audit these
      # packages. Platform markers follow the host, so the Linux CI audit must
      # also pass when local checks run on another platform (#823).
      - dependency-name: "uv"
      - dependency-name: "detect-secrets"
    # ruff and bandit are not ignored, but their hook revs must equal the
    # versions uv.lock resolves (tests/test_tool_pins.py). A Dependabot PR that
    # bumps either fails that test until the matching rev in
    # .pre-commit-config.yaml is bumped on the same PR (#445, #484).
