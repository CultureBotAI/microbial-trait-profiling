name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install just
        run: uv tool install rust-just==1.39.0
      - name: Sync environment
        run: uv sync --locked --all-extras --group dev --group qa
      - name: Run checks
        run: |
          just check
      - name: Run full pre-commit stack
        run: uv run pre-commit run --all-files
      - name: Execute offline raw-to-core workflow
        run: just core-fixture
      - name: Preserve workflow execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-workflow-fixture
          path: .tmp/core-fixture/
          if-no-files-found: error
